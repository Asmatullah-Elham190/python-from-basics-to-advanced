<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"String Manipulation","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>You are given the following initial code:</p><p><br></p><pre class=\"prettyprint linenums\">greeting = \"Hi\"\nlanguage = \"Java\"\nstatus = \"bad\"\n\nprint(f\"{greeting}, Python Learner\")\nprint(f\"I am \\\"{status}\\\"\")\n</pre><p><em>Change the values of the variables so that the program prints exactly:</em></p><pre class=\"prettyprint linenums\">Hello, Python Learner\nI am \"good\"</pre>","tests":[{"file_name":"evaluate.py","content":"import sys\r\nfrom unittest import TestCase\r\nfrom io import StringIO\r\n\r\nclass Evaluate(TestCase):\r\n    def test_hello_world(self):\r\n        # Capture printed output\r\n        original_stdout = sys.stdout\r\n        sys.stdout = StringIO()\r\n\r\n        import exercise  # Student's modified code runs\r\n\r\n        output = sys.stdout.getvalue()\r\n        expected = \"Hello, Python Learner\\nI am \\\"good\\\"\\n\"\r\n\r\n        self.assertEqual(output, expected, \"You must print Hello, Python Learner and I am \\\"good\\\"\")\r\n\r\n        sys.stdout = original_stdout\r\n"}],"solutions":[{"file_name":"exercise.py","content":"# Corrected variable values to match expected output\r\n\r\ngreeting = \"Hello\"\r\nlanguage = \"Python\"\r\nstatus = \"good\"\r\n\r\nprint(f\"{greeting}, {language} Learner\")\r\nprint(f\"I am \\\"{status}\\\"\")\r\n"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
